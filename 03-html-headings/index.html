<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Headings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Main Heading (h1)</h1>
    <p>This is the most important heading.</p>
    
    <h2>Subheading (h2)</h2>
    <p>Used for major sections.</p>
    
    <h3>Sub-subheading (h3)</h3>
    <p>For subsections.</p>
    
    <h4>Heading 4 (h4)</h4>
    <p>Further subdivision.</p>
    
    <h5>Heading 5 (h5)</h5>
    <p>Even more specific.</p>
    
    <h6>Heading 6 (h6)</h6>
    <p>The least important heading.</p>
</body>
</html>
