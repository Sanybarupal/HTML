<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Text Formatting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>HTML Text Formatting</h1>
    
    <p><b>Bold text</b> using &lt;b&gt; and <strong>strong text</strong> using &lt;strong&gt;.</p>
    
    <p><i>Italic text</i> using &lt;i&gt; and <em>emphasized text</em> using &lt;em&gt;.</p>
    
    <p><u>Underlined text</u> using &lt;u&gt;.</p>
    
    <p><mark>Marked text</mark> using &lt;mark&gt;.</p>
    
    <p><small>Small text</small> using &lt;small&gt;.</p>
    
    <p><del>Deleted text</del> and <ins>inserted text</ins>.</p>
    
    <p>Chemical formula: H<sub>2</sub>O and equation: E=mc<sup>2</sup>.</p>
</body>
</html>
