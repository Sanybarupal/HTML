<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Links</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>HTML Links</h1>
    </header>
    <main>
        <p>Links are essential for navigation on the web. The &lt;a&gt; tag is used to create hyperlinks.</p>
        <p>Example: <a href="https://www.example.com">Visit Example</a></p>
        <p>Links can be absolute or relative, and can open in new tabs with target="_blank".</p>
    </main>
    <footer>
        <p>Learn more about links in the next lessons.</p>
    </footer>
</body>
</html>
