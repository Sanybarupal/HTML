<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Lists</h1>
    </header>
    <main>
        <p>This lesson introduces Lists in HTML.</p>
        <p>Learn the key concepts and examples to build your web development skills.</p>
        
        <h2>Unordered List</h2>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
        
        <h2>Ordered List</h2>
        <ol>
            <li>First item</li>
            <li>Second item</li>
            <li>Third item</li>
        </ol>
    </main>
    <footer>
        <p>Explore more in the README.md file.</p>
    </footer>
</body>
</html>
