<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML SVG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>HTML SVG</h1>
    
    <svg width="300" height="200" style="border: 1px solid #ccc;">
        <circle cx="50" cy="50" r="40" fill="blue" />
        <rect x="120" y="20" width="80" height="60" fill="red" />
        <polygon points="200,10 250,190 160,210" fill="green" />
        <text x="10" y="150" fill="black">SVG Text</text>
    </svg>
</body>
</html>
